<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[[도구 이름]]</title>
<style>
  /* ===== 중기쌤의 수학 실험실 공통 테마 =====
     이 :root 블록과 아래 "공통 셸" 영역은 모든 도구가 동일하게 유지합니다.
     도구별 CSS는 파일 아래쪽 "도구 전용" 영역에만 추가하세요. */
  :root{
    --bg:#f2f0e9;
    --panel:#fbf9f3;
    --panel-2:#f4f1e9;
    --line:#d8d2c7;
    --border-soft:#eee9df;
    --text:#15171a;
    --muted:#6b6f74;
    --faint:#9a958a;
    --accent:#ff5a30;
    --accent-weak:rgba(255,90,48,.14);
    --lime:#d9f24f;
    --shadow:0 10px 28px rgba(21,23,26,.055);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      linear-gradient(rgba(21,23,26,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(21,23,26,.035) 1px, transparent 1px),
      var(--bg);
    background-size:34px 34px;
    color:var(--text);
    font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;
    letter-spacing:-.015em;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;color:inherit}
  .num{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  .app{width:100%;max-width:1180px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}

  /* ---- 공통 셸: 상단바 ---- */
  .topbar{
    min-height:72px;
    display:flex;
    gap:14px;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    background:rgba(242,240,233,.90);
    border:1px solid var(--line);
    border-radius:18px;
    backdrop-filter:blur(14px);
  }
  .brand-area{display:flex;align-items:center;gap:18px;min-width:0}
  .home-link{
    display:flex;align-items:center;gap:10px;flex:none;
    color:var(--text);text-decoration:none;
    padding:7px 10px 7px 8px;border-radius:12px;
    transition:background .18s ease;
  }
  .home-link:hover{background:#e7e3d9}
  .home-arrow{
    width:31px;height:31px;border:1px solid #c9c4b8;border-radius:50%;
    display:grid;place-items:center;font-size:16px;line-height:1;background:#fbf9f3;
  }
  .brand-copy{display:block;line-height:1.15}
  .brand-copy strong{display:block;font-size:14px;font-weight:800;letter-spacing:-.035em}
  .brand-copy small{
    display:block;margin-top:4px;color:#8a8d90;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:7.5px;letter-spacing:.13em;white-space:nowrap;
  }
  .top-divider{width:1px;height:34px;background:#d3cec3;flex:none}
  .title-row{display:block;min-width:0}
  .eyebrow{
    display:flex;align-items:center;gap:7px;margin-bottom:4px;
    color:#7b7770;font-size:10px;font-weight:750;white-space:nowrap;
  }
  .eyebrow span{display:block;width:18px;height:2px;background:var(--accent)}
  h1{
    font-size:clamp(18px,1.25vw,24px);
    margin:0;
    font-weight:800;letter-spacing:-.04em;white-space:nowrap;
  }
  h1 em{
    font-style:normal;font-weight:500;
    background:linear-gradient(transparent 60%,var(--lime) 0);
    padding:0 .04em;
  }
  .subtitle{margin:4px 0 0;color:#666b6f;font-size:11.5px}
  .badge{
    display:inline-flex;align-items:center;gap:7px;flex:none;
    background:#15171a;color:#fff;border:0;
    border-radius:999px;padding:8px 12px;font-weight:700;font-size:12px;white-space:nowrap;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:#73c48f}

  /* ---- 공통 셸: 패널 ----
     기본은 "넓은 그림 영역 + 좁은 설정 영역" 2단입니다.
     패널 수가 다르면 grid-template-columns만 바꾸고, 좁은 화면에서 1단으로
     떨어지는 @media (max-width:900px) 규칙은 남겨 두세요. */
  .workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:10px}
  .panel{
    min-width:0;
    display:flex;flex-direction:column;
    background:rgba(251,249,243,.96);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .panel-head{
    flex:0 0 auto;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    background:rgba(247,244,236,.92);
  }
  .panel-title{
    font-size:15px;font-weight:800;letter-spacing:-.025em;
    position:relative;padding-left:10px;
  }
  .panel-title::before{
    content:"";position:absolute;left:0;top:.15em;bottom:.15em;
    width:3px;border-radius:3px;background:var(--accent);
  }
  .panel-desc{color:#74716b;font-size:11.5px;margin-top:5px;line-height:1.45}
  .panel-body{flex:1;min-height:0;padding:14px}

  /* ---- 공통 셸: 버튼 ---- */
  .btn{
    border:1px solid #c9c4b8;background:#fbf9f3;color:#15171a;
    border-radius:999px;font-weight:700;font-size:12.5px;
    padding:9px 14px;cursor:pointer;line-height:1;
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
  }
  .btn:hover:not(:disabled){transform:translateY(-1px);border-color:#15171a;background:#f2efe6}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.primary{background:#15171a;color:#fff;border-color:#15171a}
  .btn.primary:hover:not(:disabled){background:#2b2e31}
  .btn.danger{color:#a73b2c}
  .btn.icon-btn{width:38px;height:38px;padding:0;border-radius:10px;font-size:18px;display:grid;place-items:center}

  /* ---- 공통 셸: 그림 영역 (캔버스·SVG) ---- */
  .chart-wrap{background:#fff;border:1px solid #e3ded4;border-radius:12px;overflow:hidden;position:relative}
  .chart-wrap canvas,.chart-wrap svg{display:block;width:100%;height:100%}

  /* ---- 공통 셸: 입력·지표·안내 (쓰지 않는 것은 지우세요) ---- */
  .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .control{display:flex;flex-direction:column;gap:5px}
  .control label{font-size:11px;color:var(--muted);font-weight:800}
  .control input{
    width:100%;padding:9px 10px;font-weight:700;
    border:1px solid #d3cec3;background:#fff;color:var(--text);border-radius:10px;
  }
  .control input:focus{outline:3px solid rgba(217,242,79,.42);border-color:#9aa64b}
  .control input[type="range"]{
    padding:0;height:22px;border:0;border-radius:0;background:transparent;
    accent-color:#15171a;cursor:pointer;
  }
  .checkbox-control{
    justify-content:center;min-height:58px;padding:8px 10px;
    border:1px solid var(--line);background:var(--panel-2);border-radius:12px;
  }
  .checkbox-control label{display:flex;align-items:center;gap:8px;color:var(--text);cursor:pointer;font-size:11px}
  .checkbox-control input{width:17px;height:17px;padding:0;accent-color:#15171a;cursor:pointer}

  .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .metric{background:var(--panel-2);border:1px solid #ddd7cc;border-radius:11px;padding:8px 9px;min-width:0}
  .metric .label{color:#77736d;font-size:10px;font-weight:800;margin-bottom:3px}
  .metric .value{
    font-size:15px;font-weight:850;color:var(--text);
    font-variant-numeric:tabular-nums;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .formula{
    background:#15171a;color:#f6f2e9;border:1px solid #15171a;border-radius:12px;
    padding:9px 10px;line-height:1.55;font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow:auto;
  }
  .note{
    padding:10px 12px;border-radius:10px;
    background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
    font-size:11px;line-height:1.5;
  }
  .note b{color:#7c2d12;font-weight:800}
  .status{min-height:19px;font-size:11px;line-height:1.4;font-weight:750;color:var(--muted)}
  .status.ok{color:#32724f}
  .status.error{color:#b44634}

  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .legend-item i{width:11px;height:11px;border-radius:3px;flex:none}

  /* ---- 공통 셸: 반응형 (이 3개 블록은 그대로 유지) ----
     주의: .topbar에 align-items:stretch를 쓰면 알약 모양 .badge가
     줄바꿈된 제목 높이만큼 세로로 늘어나 거대한 원처럼 깨집니다. */
  @media (max-width:1080px){
    .brand-copy small{display:none}
    .brand-copy strong{font-size:13px}
    .top-divider{height:28px}
  }
  @media (max-width:900px){
    .workspace{grid-template-columns:1fr}
  }
  @media (max-width:820px){
    .topbar{align-items:flex-start}
    .brand-area{align-items:flex-start}
    .home-link{padding-left:2px}
    .top-divider{display:none}
    .brand-copy{display:none}
    .title-row{display:block}
    h1{white-space:normal}
    .eyebrow{white-space:normal}
    .badge{display:none}
  }
  @media (max-width:520px){
    .app{padding:7px}
    .topbar{border-radius:14px;padding:9px 10px}
    .home-arrow{width:34px;height:34px}
    h1{font-size:20px;line-height:1.25}
    .subtitle{font-size:11px;white-space:normal}
    .panel{border-radius:14px}
    .panel-head{padding:12px}
    .btn{min-height:40px}
    .controls{grid-template-columns:1fr}
  }

  /* ===== 도구 전용 CSS는 여기부터 ===== */

</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand-area">
      <a class="home-link" href="../#tools" aria-label="중기쌤의 수학 실험실 메인으로">
        <span class="home-arrow">←</span>
        <span class="brand-copy">
          <strong>중기쌤의 수학 실험실</strong>
          <small>MATHEMATICS LABORATORY</small>
        </span>
      </a>
      <span class="top-divider" aria-hidden="true"></span>
      <div class="title-row">
        <div class="eyebrow"><span></span>[[과목 · 분류]]</div>
        <h1>[[도구 이름]]</h1>
        <p class="subtitle">[[한 줄 설명 — 학생이 무엇을 관찰하게 되는지]]</p>
      </div>
    </div>
    <!-- 상태 표시가 필요 없는 도구라면 .badge는 통째로 지워도 됩니다 -->
    <div class="badge"><span class="dot"></span><span id="stateBadge">준비됨</span></div>
  </div>

  <section class="workspace">
    <article class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">① [[첫 번째 단계 이름]]</div>
          <div class="panel-desc">[[이 패널에서 무엇을 하는지]]</div>
        </div>
      </div>
      <div class="panel-body">
        <div class="chart-wrap" style="aspect-ratio:1.4/1"><canvas id="cv"></canvas></div>
      </div>
    </article>

    <article class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">② [[두 번째 단계 이름]]</div>
          <div class="panel-desc">[[이 패널에서 무엇을 하는지]]</div>
        </div>
      </div>
      <div class="panel-body">
        <!-- 도구 내용 -->
      </div>
    </article>
  </section>
</div>

</body>
